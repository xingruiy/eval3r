name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff check
        run: ruff check eval3r/

      - name: Mypy
        run: mypy eval3r/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      NO_COLOR: "1"
      PYOPENGL_PLATFORM: egl
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system OpenGL/EGL dependencies (software rendering)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1-mesa-dri \
            libglib2.0-0 \
            libgl1

      - name: Install package + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,render]

      - name: Run tests
        run: pytest
