name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install headless OpenGL system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglx-mesa0 \
            libgl1-mesa-dri

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          # Installs the full required runtime dependency set (no extras) plus dev tools.
          pip install -e .
          pip install ruff mypy pytest mkdocs

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy eval3r

      - name: Diagnose headless OpenGL
        run: |
          python -VV
          python -m pip freeze | grep -E 'pyrender|PyOpenGL|open3d|pytest'
          ldconfig -p | grep -E 'libEGL|libGL' || true
          python - <<'PY'
          import os

          os.environ.setdefault("PYOPENGL_PLATFORM", "egl")
          import pyrender

          renderer = pyrender.OffscreenRenderer(16, 16)
          renderer.delete()
          print("pyrender EGL OK")
          PY

      - name: Tests (pytest)
        run: pytest

      - name: Docs build (mkdocs)
        run: mkdocs build --strict
