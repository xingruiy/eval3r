site_name: Eval3r
site_description: Dataset-aware 3D reconstruction evaluation under explicit protocols.
site_url: https://eval3r.readthedocs.io/
repo_url: https://github.com/xingruiy/eval3r
repo_name: xingruiy/eval3r
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: readthedocs
  highlightjs: true

nav:
  - Home: index.md
  - Installation: install.md
  - Quickstart: quickstart.md
  - Prediction format: prediction_format.md
  - Protocols: protocols.md
  - Fidelity: fidelity.md
  - Datasets: datasets.md
  - Metrics: metrics.md
  - Alignment: alignment.md
  - Backends: backends.md
  - Confidence: confidence.md
  - Failure policy: failure_policy.md
  - Result schema: schema.md
  - Reproducibility: reproducibility.md
  - Examples:
      - DTU: examples/dtu.md
      - ScanNet: examples/scannet.md
      - Tanks and Temples: examples/tanks_temples.md
      - ETH3D: examples/eth3d.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
