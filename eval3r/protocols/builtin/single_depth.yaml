schema_version: 1
protocol_version: 0.2.0
name: single_depth
fidelity: eval3r_native

dataset:
  dataset: custom
  variant: single_depth
  split: null

prediction_modality: single_depth

ground_truth:
  modality: depth
  provenance: unknown
  independence: unknown
  density: depth_image
  unit: m
  local_evaluation_status: supported

local_evaluation:
  status: supported
  reason: local files supplied by user
  public_gt_available: true
  external_assets_required: []
  official_server_required: false

alignment:
  mode: scale_median
  estimate_on: depth
  solver: none
  granularity: per_frame
  allow_override: true
  parameters: {}

confidence:
  policy: none
  allow_override: true

masking:
  pred_culling:
    method: none
  gt_culling:
    method: none
  valid_region:
    method: valid_depth
  ignore_invalid_depth: true
  invalid_depth_values: [0]

sampling:
  pred:
    method: all_points
    seed: derive
  gt:
    method: all_points
    seed: derive

# delta_1/2/3 disambiguate delta < 1.25 / 1.25^2 / 1.25^3 by name (aggregation keys
# metrics by name); the thresholds stay explicit and are never defaulted.
metrics:
  - name: absrel
  - name: sqrel
  - name: rmse
  - name: rmse_log
  - name: silog
  - name: delta_1
    threshold: 1.25
  - name: delta_2
    threshold: 1.5625
  - name: delta_3
    threshold: 1.953125

aggregation:
  per_frame: true
  per_scene: true
  mean: true
  median: true
  weighted_mean: false
  weights: none

failure_policy:
  policy: abort
  worst_values: {}

reporting:
  save_protocol_copy: true
  save_manifest_copy: true
  save_environment: true
  save_alignment_transforms: true
  formats: [json, csv]

backend_preferences:
  depth_io: imageio

notes:
  - Single-file / sequence depth protocol for local comparison. Not a dataset benchmark.
  - Scale alignment mode and granularity are first-class AlignmentSpec fields and are
    recorded in every metric's metadata; per-frame median scaling is the default.
  - Non-finite pixels, protocol-listed invalid values (0), and non-positive gt/pred
    depths are masked; the mask breakdown and valid fraction are recorded per frame.
  - silog is the Eigen et al. scale-invariant log error, reported unscaled
    (not multiplied by 100).
