schema_version: 1
protocol_version: 0.1.0
name: single_depth
fidelity: eval3r_native

dataset:
  dataset: custom
  variant: single_depth
  split: null

prediction_modality: single_depth

ground_truth:
  modality: depth
  provenance: unknown
  independence: unknown
  density: depth_image
  unit: m
  local_evaluation_status: supported

local_evaluation:
  status: supported
  reason: local files supplied by user
  public_gt_available: true
  external_assets_required: []
  official_server_required: false

alignment:
  mode: scale_median
  estimate_on: depth
  solver: none
  granularity: per_frame
  allow_override: true
  parameters: {}

confidence:
  policy: none
  allow_override: true

masking:
  pred_culling:
    method: none
  gt_culling:
    method: none
  valid_region:
    method: valid_depth
  ignore_invalid_depth: true
  invalid_depth_values: [0]

sampling:
  pred:
    method: all_points
    seed: derive
  gt:
    method: all_points
    seed: derive

metrics:
  - name: absrel
  - name: sqrel
  - name: rmse
  - name: rmse_log
  - name: delta
    threshold: 1.25
  - name: delta
    threshold: 1.5625
  - name: delta
    threshold: 1.953125

aggregation:
  per_frame: true
  per_scene: true
  mean: true
  median: true
  weighted_mean: false
  weights: none

failure_policy:
  policy: abort
  worst_values: {}

reporting:
  save_protocol_copy: true
  save_manifest_copy: true
  save_environment: true
  save_alignment_transforms: false
  formats: [json, csv]
