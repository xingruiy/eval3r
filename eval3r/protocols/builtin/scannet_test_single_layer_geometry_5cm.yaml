schema_version: 1
protocol_version: 0.1.0
name: scannet_test_single_layer_geometry_5cm
fidelity: eval3r_native

dataset:
  dataset: scannet
  variant: scannetv2_test_single_layer
  split: test
  version: scannetv2
  fingerprint: null
  notes:
    - Single-layer mesh convention.
    - Test split; the prediction is visibility-culled to the GT-observed region before
      scoring (render + TSDF trim).

prediction_modality: mesh

ground_truth:
  modality: mesh
  provenance: reconstructed
  independence: reconstruction_derived
  density: dense_surface
  path: null
  fingerprint: null
  unit: m
  source_pose_format: cam_to_world_opencv
  normalized_convention: cam_to_world_opencv_meters
  local_evaluation_status: supported
  notes:
    - GT mesh is BundleFusion-derived, not an independent laser scan.

local_evaluation:
  status: supported
  reason: test GT mesh + camera trajectory are available locally; eval3r_native geometry.
  public_gt_available: true
  external_assets_required: []
  official_server_required: false

alignment:
  mode: none
  estimate_on: none
  solver: none
  granularity: per_scene
  allow_override: false
  parameters: {}

confidence:
  policy: none
  allow_override: false

masking:
  pred_culling:
    method: gt_visibility
    source: gt
    tolerance: 0.05
    parameters:
      voxel_length: 0.04
      sdf_trunc_factor: 3.0
      depth_trunc: 6.0
      znear: 0.05
      pose_stride: 1
  gt_culling:
    method: none
  valid_region:
    method: none
  ignore_invalid_depth: true
  invalid_depth_values: [0]

sampling:
  pred:
    method: surface_area
    n_points: 200000
    seed: derive
  gt:
    method: surface_area
    n_points: 200000
    seed: derive

metrics:
  - name: accuracy
    statistic: mean
  - name: completeness
    statistic: mean
  - name: chamfer
    statistic: mean
    reduction: mean
  - name: precision
    threshold: 0.05
  - name: recall
    threshold: 0.05
  - name: fscore
    threshold: 0.05
    aggregation: per_scene_then_mean
  - name: culled_fraction

aggregation:
  per_scene: true
  mean: true
  median: true
  weighted_mean: false
  weights: none

failure_policy:
  policy: skip_and_flag
  worst_values: {}

reporting:
  save_protocol_copy: true
  save_manifest_copy: true
  save_environment: true
  save_alignment_transforms: false
  save_colored_errors: true
  save_distance_histogram: true
  formats: [json, csv, markdown, latex]

backend_preferences:
  mesh: trimesh
  pointcloud: open3d
  nearest_neighbor: scipy
  visibility: render_tsdf

notes:
  - Single-layer mesh convention; the adapter records the declared convention per scene.
  - gt_visibility culling is realized by the 'visibility' backend (render_tsdf). The
    prediction depth is rendered from the GT camera trajectory (pyrender, EGL) and
    TSDF-integrated (open3d) to recover the observed region; prediction vertices within
    the tolerance (metres) of that region are kept. culled_fraction is recorded per scene.
    See CLAUDE.md "Evaluation-time visibility culling exception".
  - Community NeuralRecon/TransformerFusion-style culling; the metric (Atlas eval_mesh,
    threshold 0.05, both-direction nearest distances) is eval3r_native, not official_like.
    Results must not be presented as official ScanNet benchmark numbers.
