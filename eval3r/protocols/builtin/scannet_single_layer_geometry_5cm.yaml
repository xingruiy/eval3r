schema_version: 1
protocol_version: 0.3.0
name: scannet_single_layer_geometry_5cm
fidelity: native

dataset:
  dataset: scannet
  variant: scannetv2_val_single_layer
  split: val
  version: scannetv2
  fingerprint: null
  notes:
    - Single-layer mesh convention.
    - Validation split; no visibility culling (culling applies to the test split only).

prediction_modality: mesh

ground_truth:
  modality: mesh
  provenance: reconstructed
  independence: reconstruction_derived
  density: dense_surface
  path: null
  fingerprint: null
  unit: m
  source_pose_format: cam_to_world_opencv
  normalized_convention: cam_to_world_opencv_meters
  local_evaluation_status: supported
  notes:
    - GT mesh is BundleFusion-derived, not an independent laser scan.

local_evaluation:
  status: supported
  reason: validation GT mesh is available locally after dataset download.
  public_gt_available: true
  external_assets_required: []
  official_server_required: false

alignment:
  mode: none
  estimate_on: none
  solver: none
  granularity: per_scene
  allow_override: false
  parameters: {}

confidence:
  policy: none
  allow_override: false

masking:
  pred_culling:
    method: none
  gt_culling:
    method: none
  valid_region:
    method: none
  ignore_invalid_depth: false
  invalid_depth_values: []

sampling:
  pred:
    method: surface_area
    n_points: 200000
    seed: derive
  gt:
    method: surface_area
    n_points: 200000
    seed: derive

metrics:
  - name: accuracy
    statistic: mean
  - name: completeness
    statistic: mean
  - name: chamfer
    statistic: mean
    reduction: mean
  - name: precision
    threshold: 0.05
  - name: recall
    threshold: 0.05
  - name: fscore
    threshold: 0.05
    aggregation: per_scene_then_mean
  - name: culled_fraction

aggregation:
  per_scene: true
  mean: true
  median: true
  weighted_mean: false
  weights: none

failure_policy:
  policy: skip_and_flag
  worst_values: {}

reporting:
  save_protocol_copy: true
  save_manifest_copy: true
  save_environment: true
  save_alignment_transforms: false
  save_colored_errors: true
  save_distance_histogram: true
  formats: [json, csv, markdown, latex]

backend_preferences:
  mesh: trimesh
  pointcloud: open3d
  nearest_neighbor: scipy

notes:
  - Single-layer mesh convention; the adapter records the declared convention per scene.
  - Validation split runs WITHOUT visibility culling (culled_fraction is 0 and is recorded
    as such). Visibility culling applies only to the test split
    (scannet_test_single_layer_geometry_5cm).
  - ScanNet has no official geometry-reconstruction benchmark. This protocol follows the
    community single-layer 5cm F-score convention (Atlas/NeuralRecon-style eval_mesh,
    threshold 0.05, both-direction nearest distances) and is therefore native. Results
    must not be presented as official ScanNet benchmark numbers.
