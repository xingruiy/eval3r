[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval3r"
version = "0.3.0"
description = "Dataset-aware 3D reconstruction evaluation under explicit protocols (meshes, point clouds, depth, trajectories)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xingrui Yang" }]
keywords = [
  "3d-reconstruction",
  "evaluation",
  "benchmark",
  "point-cloud",
  "mesh",
  "depth",
  "trajectory",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]

# All dependencies are required base dependencies and are always installed.
# There is no optional-extra system (see CLAUDE.md, .agent/backends.md).
# The project does not depend on PyTorch, FAISS, or Waymo tooling.
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "pyyaml",
  "typer",
  "rich",
  "pydantic",
  "trimesh",
  "plyfile",
  "open3d",
  "evo",
  "pycolmap",
  "imageio",
  "opencv-python",
  "pyrender",
  "matplotlib",
]

[project.urls]
Homepage = "https://github.com/xingruiy/eval3r"
Repository = "https://github.com/xingruiy/eval3r"

[project.scripts]
e3r = "eval3r.cli.main:app"

# Dev tooling only. These are NOT runtime extras; they are development
# dependencies used for lint, type check, tests, and docs builds.
[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "mkdocs",
]

[tool.setuptools.packages.find]
include = ["eval3r*"]

[tool.setuptools.package-data]
# Built-in protocol YAMLs are shipped as package data (populated in task 003).
"eval3r.protocols" = ["builtin/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI parameters via calls in argument defaults; this is the
# framework's intended pattern, so exempt them from B008.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
