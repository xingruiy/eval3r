[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval3r"
description = "Handy toolkit for saving, evaluating, and visualizing 3D reconstruction predictions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "eval3r contributors" }]
dynamic = ["version"]
keywords = ["3d", "reconstruction", "evaluation", "chamfer", "f-score"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
    "trimesh>=4",
]

[project.urls]
Homepage = "https://github.com/xingruiy/eval3r"
Repository = "https://github.com/xingruiy/eval3r"
Documentation = "https://xingruiy.github.io/eval3r"

[project.optional-dependencies]
render = ["pyrender>=0.1.45", "pillow", "imageio"]
traj = ["evo"]
torch = ["torch"]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.10", "pre-commit"]

[project.scripts]
e3r = "eval3r.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["eval3r"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/eval3r",
]

[tool.hatch.version]
path = "eval3r/_version.py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
